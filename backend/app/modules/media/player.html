<!doctype html>
<!--
  后台「预览」用的播放页（BUNNY_MODE=local），部署到 https://media.<域名>/player/。
  签名后的 m3u8 地址放在 URL hash 里（不会发给服务器、不进访问日志），
  只接受本站 /v/ 下的地址，避免被当成任意视频的外链播放器。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AsiaTV 预览</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #bbb; font: 14px system-ui, sans-serif; }
      video { width: 100%; height: 100%; object-fit: contain; background: #000; }
      p { position: absolute; inset: 0; margin: auto; height: 1.5em; text-align: center; }
    </style>
  </head>
  <body>
    <video id="v" controls playsinline autoplay></video>
    <script src="hls.min.js"></script>
    <script>
      (function () {
        var video = document.getElementById("v");
        var fail = function (text) {
          video.remove();
          var p = document.createElement("p");
          p.textContent = text;
          document.body.appendChild(p);
        };
        var src = "";
        try { src = decodeURIComponent(location.hash.slice(1)); } catch (e) { src = ""; }
        if (src.indexOf(location.origin + "/v/") !== 0) return fail("预览地址无效");
        if (window.Hls && window.Hls.isSupported()) {
          var hls = new window.Hls();
          hls.on(window.Hls.Events.ERROR, function (_, data) {
            if (data.fatal) fail("播放失败：链接已过期或视频不存在，请关闭后重新预览");
          });
          hls.loadSource(src);
          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
        } else {
          fail("当前浏览器不支持 HLS 播放");
        }
      })();
    </script>
  </body>
</html>
